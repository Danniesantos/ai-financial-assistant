name: AI Financial Assistant - CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: financial_assistant
          POSTGRES_USER: financial_user
          POSTGRES_PASSWORD: financial_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U financial_user -d financial_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PORT: 5433
      POSTGRES_DB: financial_assistant
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
      OPENAI_API_KEY: test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build and test application
        run: ./gradlew clean build
