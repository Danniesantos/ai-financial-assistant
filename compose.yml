services:
  postgres:
    image: postgres:17
    container_name: ai-financial-assistant-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: